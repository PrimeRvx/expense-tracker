<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ผู้ดูแลระบบ · Expense Tracker</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <script src="../boot-theme.js"></script>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../favicon.svg" alt="" width="28" height="28">
      <span>ผู้ดูแลระบบ</span>
    </div>
    <div class="topbar-right" id="whoami" hidden>
      <span class="muted" id="whoami-email"></span>
      <a class="btn btn-ghost" href="../">กลับไปที่แอป</a>
      <button class="btn btn-ghost" id="btn-logout" type="button">ออกจากระบบ</button>
    </div>
  </header>

  <!-- เข้าสู่ระบบ -->
  <main id="view-login" class="center" hidden>
    <form class="card login" id="login-form" novalidate>
      <h1>เข้าสู่ระบบผู้ดูแล</h1>
      <label>อีเมล<input type="email" name="email" autocomplete="username" required></label>
      <label>รหัสผ่าน<input type="password" name="password" autocomplete="current-password" required></label>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn btn-primary" type="submit">เข้าสู่ระบบ</button>
    </form>
  </main>

  <!-- ไม่มีสิทธิ์ / ยังไม่ติดตั้ง -->
  <main id="view-denied" class="center" hidden>
    <div class="card login">
      <h1 id="denied-title">หน้านี้สำหรับผู้ดูแลระบบ</h1>
      <p class="muted" id="denied-text">บัญชีนี้ไม่มีสิทธิ์ผู้ดูแล</p>
      <a class="btn btn-primary" href="../">กลับไปที่แอป</a>
    </div>
  </main>

  <!-- หน้าหลัก -->
  <main id="view-app" class="layout" hidden>
    <aside class="sidebar card">
      <form id="search-form" class="search" role="search">
        <input type="search" id="search" placeholder="ค้นหาอีเมล ชื่อ หรือรหัสผู้ใช้" aria-label="ค้นหาผู้ใช้">
      </form>
      <button class="nav-overview" id="btn-overview" type="button">ภาพรวมระบบ</button>
      <ul class="user-list" id="user-list"></ul>
      <div class="pager" id="user-pager"></div>
    </aside>

    <section class="content" id="content" aria-live="polite"></section>
  </main>

  <!-- ป๊อปอัปทั่วไป -->
  <dialog id="dialog" class="card">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <p class="error" id="dialog-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" value="cancel" type="submit" formnovalidate>ยกเลิก</button>
        <button class="btn btn-primary" id="dialog-ok" value="ok" type="submit">ตกลง</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
